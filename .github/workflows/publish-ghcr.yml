name: Publish Docker images to GHCR

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCKER_BUILD_RECORD_RETENTION_DAYS: 7

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv sync --frozen --dev

      - name: Run Ruff lint
        run: >-
          uv run ruff check
          --output-format=github
          .

  deterministic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: ruff-check
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv sync --frozen --dev

      - name: Run deterministic tests
        run: >-
          uv run pytest -m "not live" -p no:cacheprovider
          --durations=10
          -ra
          sidecar/autoskill/tests

  revocation-traversal-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: deterministic-tests
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: autoskill
          POSTGRES_USER: autoskill
          POSTGRES_PASSWORD: autoskill-dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autoskill -d autoskill"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AUTOSKILL_DATABASE_URL: postgresql://autoskill:autoskill-dev@127.0.0.1:5432/autoskill
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - name: Install smoke dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv sync --frozen --dev

      - name: Wait for Postgres
        run: |
          uv run python - <<'PY'
          import asyncio
          import os

          import asyncpg


          async def main() -> None:
              database_url = os.environ["AUTOSKILL_DATABASE_URL"]
              last_error = None
              for _ in range(30):
                  try:
                      conn = await asyncpg.connect(database_url)
                      await conn.execute("SELECT 1")
                      await conn.close()
                      return
                  except Exception as exc:  # noqa: BLE001
                      last_error = exc
                      await asyncio.sleep(1)
              raise SystemExit(f"Postgres did not become ready: {last_error}")


          asyncio.run(main())
          PY

      - name: Run revocation traversal smoke
        run: >-
          uv run python
          scripts/autoskill_revocation_traversal_smoke.py

  topology-admission-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: deterministic-tests
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: autoskill
          POSTGRES_USER: autoskill
          POSTGRES_PASSWORD: autoskill-dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autoskill -d autoskill"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AUTOSKILL_DATABASE_URL: postgresql://autoskill:autoskill-dev@127.0.0.1:5432/autoskill
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - name: Install smoke dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv sync --frozen --dev

      - name: Wait for Postgres
        run: |
          uv run python - <<'PY'
          import asyncio
          import os

          import asyncpg


          async def main() -> None:
              database_url = os.environ["AUTOSKILL_DATABASE_URL"]
              last_error = None
              for _ in range(30):
                  try:
                      conn = await asyncpg.connect(database_url)
                      await conn.execute("SELECT 1")
                      await conn.close()
                      return
                  except Exception as exc:  # noqa: BLE001
                      last_error = exc
                      await asyncio.sleep(1)
              raise SystemExit(f"Postgres did not become ready: {last_error}")


          asyncio.run(main())
          PY

      - name: Run topology admission smoke
        run: >-
          uv run python
          scripts/autoskill_topology_admission_smoke.py

  plugin-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: deterministic-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Run plugin checks
        working-directory: plugin/autoskill
        run: npm run check

      - name: Run plugin tests
        working-directory: plugin/autoskill
        run: npm test

  observatory-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: deterministic-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sidecar/autoskill/observatory/package-lock.json

      - name: Install Observatory dependencies
        working-directory: sidecar/autoskill/observatory
        run: npm ci

      - name: Build Observatory
        working-directory: sidecar/autoskill/observatory
        run: npm run build

  build-test-images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - plugin-check
      - observatory-build
      - revocation-traversal-smoke
      - topology-admission-smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: core
            dockerfile: Dockerfile.core
          - image: observatory
            dockerfile: Dockerfile.observatory
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build local test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: skillkernel-${{ matrix.image }}:ci

  publish-images:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: build-test-images
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: core
            dockerfile: Dockerfile.core
          - image: observatory
            dockerfile: Dockerfile.observatory

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          pull: true
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
