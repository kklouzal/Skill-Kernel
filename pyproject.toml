[project]
name = "openclaw-skillkernel"
version = "0.1.0"
description = "SkillKernel / autoskill sidecar for OpenClaw AutoSkill Manager"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30.0",
  "fastapi>=0.115.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.9.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["sidecar/autoskill/tests"]
pythonpath = ["sidecar"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

