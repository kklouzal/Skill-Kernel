services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: skillkernel
      POSTGRES_USER: skillkernel
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - skillkernel-postgres:/var/lib/postgresql/data
    networks:
      - skillkernel-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillkernel -d skillkernel"]
      interval: 10s
      timeout: 5s
      retries: 12
    secrets:
      - postgres_password

  core:
    build:
      context: ..
      dockerfile: containers/core/Dockerfile
    env_file:
      - env.core.example
      - env.postgres.example
    environment:
      SKILLKERNEL_DATABASE_URL_FILE: /run/secrets/database_url
      SKILLKERNEL_SIDECAR_TOKEN_FILE: /run/secrets/plugin_shared_secret
      SKILLKERNEL_CONTROL_TOKEN_FILE: /run/secrets/control_token
      SKILLKERNEL_ADMIN_TOKEN_FILE: /run/secrets/admin_token
      SKILLKERNEL_CORE_PORT: 8765
    volumes:
      - skillkernel-runtime:/var/lib/skillkernel
      - ../.skillkernel/workspace:/workspace
      - ../.skillkernel/openclaw:/openclaw:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - skillkernel-data
      - skillkernel-control
      - skillkernel-models
    ports:
      - "127.0.0.1:8765:8765"
    secrets:
      - database_url
      - plugin_shared_secret
      - control_token
      - admin_token
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py", "core"]
      interval: 10s
      timeout: 5s
      retries: 12

  observatory:
    build:
      context: ..
      dockerfile: containers/observatory/Dockerfile
    env_file:
      - env.observatory.example
      - env.postgres.example
    environment:
      SKILLKERNEL_CORE_UPSTREAM: http://core:8765
      SKILLKERNEL_OBSERVATORY_PORT: 8757
    networks:
      - skillkernel-data
      - skillkernel-control
    ports:
      - "127.0.0.1:8757:8757"
    healthcheck:
      test: ["CMD", "python3", "/app/healthcheck.py", "observatory"]
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  skillkernel-data: {}
  skillkernel-control: {}
  skillkernel-models: {}

volumes:
  skillkernel-postgres: {}
  skillkernel-runtime: {}

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  database_url:
    file: ./secrets/database_url.txt
  plugin_shared_secret:
    file: ./secrets/plugin_shared_secret.txt
  control_token:
    file: ./secrets/control_token.txt
  admin_token:
    file: ./secrets/admin_token.txt
